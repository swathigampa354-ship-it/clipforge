version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clipforge
      POSTGRES_USER: clipforge
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipforge"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    image: ghcr.io/clipforge/api:latest
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 8
    environment:
      DATABASE_URL: postgresql+asyncpg://clipforge:${DB_PASSWORD}@postgres:5432/clipforge
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      CLIPPYME_X264_CRF: "23"
      WHISPER_MODEL_SIZE: "medium"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2'
          memory: 1G
      restart_policy:
        condition: on-failure
        max_attempts: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    image: ghcr.io/clipforge/worker:latest
    command: celery -A worker.app.celery_app worker --loglevel=info --concurrency=8 --queues=processing,transcription,rendering,ai
    environment:
      DATABASE_URL: postgresql+asyncpg://clipforge:${DB_PASSWORD}@postgres:5432/clipforge
      REDIS_URL: redis://redis:6379/0
      CLIPPYME_X264_CRF: "23"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      - api
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '4'
          memory: 2G
      restart_policy:
        condition: on-failure
        max_attempts: 3

  beat:
    image: ghcr.io/clipforge/api:latest
    command: celery -A worker.app.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://clipforge:${DB_PASSWORD}@postgres:5432/clipforge
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    deploy:
      replicas: 1

  frontend:
    image: ghcr.io/clipforge/frontend:latest
    ports:
      - "80:80"
    environment:
      VITE_API_URL: http://localhost/api/v1
    depends_on:
      - api
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 512M

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 256M

volumes:
  postgres_data:
  redis_data: