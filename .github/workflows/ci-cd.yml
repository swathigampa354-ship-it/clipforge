name: ClipForge CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

defaults:
  run:
    shell: bash
    working-directory: /home/runner/work/clipforge/clipforge

jobs:
  # ── Lint & Typecheck ──
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install linting tools
        run: |
          pip install --quiet ruff==0.8.2 black==24.10.0 mypy==1.13.0 isort==5.13.2

      - name: Install core dependencies
        run: |
          pip install --quiet fastapi uvicorn pydantic pydantic-settings sqlalchemy asyncpg alembic
          pip install --quiet celery redis python-jose passlib python-multipart httpx aiofiles
          pip install --quiet python-minio pillow opencv-python-headless numpy pyyaml python-dotenv
          pip install --quiet rich structlog slowapi

      - name: Ruff lint
        run: |
          ruff check api/ worker/ tests/ || true

      - name: Black format check
        run: |
          black --check --diff api/ worker/ tests/ || true

      - name: MyPy type check
        run: |
          mypy api/ worker/ --ignore-missing-imports --no-error-summary || true

      - name: Lint summary
        run: |
          echo "## 🔍 Lint Results" >> $GITHUB_STEP_SUMMARY

  # ── Unit Tests ──
  test:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install core dependencies
        run: |
          pip install --quiet fastapi uvicorn pydantic pydantic-settings sqlalchemy asyncpg alembic
          pip install --quiet celery redis python-jose passlib python-multipart httpx aiofiles
          pip install --quiet python-minio pillow opencv-python-headless numpy pyyaml python-dotenv
          pip install --quiet rich structlog slowapi
          pip install --quiet pytest pytest-asyncio pytest-cov aiosqlite httpx
          pip install --quiet --no-deps mediapipe opencv-python-headless numpy
          echo "Core dependencies installed"

      - name: Install api package
        run: |
          cd api && pip install --quiet -e .
          cd ..
          echo "API package installed"

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U test_user; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 1
          done

      - name: Run tests
        run: |
          export DATABASE_URL="postgresql+asyncpg://test_user:test_pass@localhost:5432/test_db"
          export REDIS_URL="redis://localhost:6379/0"
          export SECRET_KEY="test-secret-key"
          pytest tests/ -v --tb=short --ignore=tests/unit/test_main.py
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_pass@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ── Build Docker Images ──
  build:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [api, worker, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.component }}
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.component }}:${{ github.sha }} -f ${{ matrix.component }}/Dockerfile .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.component }}:${{ github.sha }}
          echo "✅ ${{ matrix.component }} image built and pushed"

  # ── Deploy to Staging ──
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.repository == 'swathigampa354-ship-it/clipforge'
    environment: staging
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to staging
        run: |
          docker compose -f docker-compose.yml pull
          docker compose -f docker-compose.yml up -d --force-recreate
          docker compose -f docker-compose.yml ps

  # ── Deploy to Production ──
  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.repository == 'swathigampa354-ship-it/clipforge'
    environment: production
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to production
        run: |
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --force-recreate
          docker compose -f docker-compose.prod.yml ps