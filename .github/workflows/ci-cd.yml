name: ClipForge CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

# ── Global Job Defaults ──
defaults:
  run:
    shell: bash
    working-directory: /home/runner/work/clipforge/clipforge

jobs:
  # ── Lint & Typecheck ──
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install core dependencies
        run: |
          pip install --quiet fastapi uvicorn pydantic sqlalchemy aiofiles httpx redis
          pip install --quiet --no-deps mediapipe opencv-python-headless numpy pillow
          echo "Core dependencies installed"

      - name: Ruff lint (warnings only)
        run: |
          cd api && ruff check . || true
          cd ../worker && ruff check . || true
          cd ../tests && ruff check . || true
          echo "✅ Ruff scan complete (warnings shown, not blocking)"

      - name: Black format check (warnings only)
        run: |
          cd api && black --check --diff . || true
          cd ../worker && black --check --diff . || true
          cd ../tests && black --check --diff . || true
          echo "✅ Black check complete (warnings shown, not blocking)"

      - name: MyPy type check (warnings only)
        run: |
          cd api && mypy . --ignore-missing-imports --no-error-summary --show-error-codes || true
          echo "✅ MyPy check complete (warnings shown, not blocking)"

      - name: Lint summary
        run: |
          echo "## 🔍 Lint Results" >> $GITHUB_STEP_SUMMARY
          echo "Lint checks completed. Warnings do not block the pipeline." >> $GITHUB_STEP_SUMMARY

  # ── Unit Tests ──
  test:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --quiet fastapi uvicorn pydantic pydantic-settings sqlalchemy asyncpg alembic
          pip install --quiet celery redis python-jose passlib python-multipart httpx aiofiles
          pip install --quiet python-minio pillow opencv-python-headless numpy pyyaml python-dotenv
          pip install --quiet rich structlog slowapi faster-whisper
          pip install --quiet pytest pytest-asyncio pytest-cov
          cd api && pip install --quiet -e .
          echo "All dependencies installed"

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U test_user; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 1
          done

      - name: Run tests
        run: |
          pytest tests/ -v --cov=api --cov-report=xml --cov-report=term-missing --tb=short
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_pass@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ── Build Docker Images ──
  build:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [api, worker, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.component }}
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.component }}:${{ github.sha }} -f ${{ matrix.component }}/Dockerfile .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.component }}:${{ github.sha }}
          echo "✅ ${{ matrix.component }} image built and pushed"

  # ── Deploy to Staging ──
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.repository == 'swathigampa354-ship-it/clipforge'
    environment: staging
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to staging
        run: |
          docker compose -f docker-compose.yml pull
          docker compose -f docker-compose.yml up -d --force-recreate
          docker compose -f docker-compose.yml ps

  # ── Deploy to Production ──
  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.repository == 'swathigampa354-ship-it/clipforge'
    environment: production
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to production
        run: |
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --force-recreate
          docker compose -f docker-compose.prod.yml ps