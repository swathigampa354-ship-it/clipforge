version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: clipforge-postgres
    environment:
      POSTGRES_DB: clipforge
      POSTGRES_USER: ${DB_USER:-clipforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-clipforge_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipforge"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clipforge-net

  redis:
    image: redis:7-alpine
    container_name: clipforge-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clipforge-net

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: clipforge-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      DATABASE_URL: postgresql+asyncpg://clipforge:clipforge_secret@postgres:5432/clipforge
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      CLIPPYME_X264_CRF: "23"
      CLIPPYME_X264_PRESET: "medium"
      WHISPER_MODEL_SIZE: "medium"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./api:/app/api
      - ./uploads:/app/uploads
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - clipforge-net

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: clipforge-worker
    command: celery -A worker.app.celery_app worker --loglevel=info --concurrency=4 --queues=processing,transcription,rendering,ai
    environment:
      DATABASE_URL: postgresql+asyncpg://clipforge:clipforge_secret@postgres:5432/clipforge
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CLIPPYME_X264_CRF: "23"
      CLIPPYME_X264_PRESET: "medium"
      WHISPER_MODEL_SIZE: "medium"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    networks:
      - clipforge-net

  beat:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: clipforge-beat
    command: celery -A worker.app.celery_app beat --loglevel=info --scheduler redis.schedulers.RedisScheduler
    environment:
      DATABASE_URL: postgresql+asyncpg://clipforge:clipforge_secret@postgres:5432/clipforge
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - clipforge-net

  minio:
    image: minio/minio:latest
    container_name: clipforge-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - clipforge-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: clipforge-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      - api
    networks:
      - clipforge-net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  clipforge-net:
    driver: bridge