[project]
name = "clipforge"
version = "0.1.0"
description = "ClipForge AI Video Clipping SaaS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28.0",
    "aiofiles>=24.1.0",
    "python-minio>=9.0.0",
    "pillow>=11.1.0",
    "numpy>=2.1.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.9.0",
    "structlog>=24.2.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "black>=24.10.0",
    "ruff>=0.8.2",
    "isort>=5.13.2",
    "mypy>=1.13.0",
    "httpx>=0.28.0",
]
ai = [
    "faster-whisper>=1.2.0",
    "torch>=2.3.0",
]
gpu = [
    "torch[cuda]>=2.3.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clipforge*", "packages*"]

[tool.ruff]
target-version = "py312"
line-length = 120
select = ["E", "F", "I", "B", "C", "W"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
